name: 3dtrees_raster
owner: bgruening
description: DTM, CHM, voxel point counts and tile-level forest-structure metrics from segmented point clouds.
homepage_url: https://github.com/3dTrees-earth/3Dtrees_Raster
long_description: |
  Computes a DTM and CHM, full-resolution 0.5 m voxel point counts and fixed
  20 m tile metrics of forest structure for each requested instance dimension
  of a segmented LAS/LAZ or COPC point cloud, with optional statistical outlier
  removal and an optional area of interest.
remote_repository_url: https://github.com/bgruening/galaxytools/tree/master/tools/3dtrees_raster
type: unrestricted
categories:
- "Geo Science"
